[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olympus-e-pl3-research"
version = "0.1.0"
description = "Authenticated, offline Olympus E-PL3 firmware evidence"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Alexander Rassokhin"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
epl3-research = "epl3_research.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
epl3_research = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
